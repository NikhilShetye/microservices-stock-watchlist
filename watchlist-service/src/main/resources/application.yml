spring:
  application:
    name: watchlist-service

  data:
      redis:
          host: localhost
          port: 6379

  kafka:
      bootstrap-servers: localhost:9092

  security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: http://localhost:8081/realms/stock-realm
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka            

