server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        - id: watchlist-service
          uri: lb://WATCHLIST-SERVICE
          predicates:
            - Path=/watchlist/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    root: INFO

jwt:
  secret: ${SECRET_KEY}